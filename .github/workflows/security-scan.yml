name: Security Scan

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm audit
        run: |
          npm audit --audit-level=high || echo "::warning::npm audit found vulnerabilities"
        continue-on-error: true

      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for potential security issues..."
          grep -r "password\s*=" . --include="*.js" --include="*.html" --exclude-dir=node_modules || echo "No hardcoded passwords found"
          grep -r "api_key\s*=" . --include="*.js" --include="*.html" --exclude-dir=node_modules || echo "No hardcoded API keys found"
          grep -r "secret\s*=" . --include="*.js" --include="*.html" --exclude-dir=node_modules || echo "No hardcoded secrets found"

      - name: Check for common secret patterns
        run: |
          echo "Checking for leaked tokens or keys..."
          # Match common secret-looking strings (base64 blobs, sk_live, etc.)
          grep -rE "(sk_live|pk_live|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36})" \
            --include="*.js" --include="*.html" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=.git . \
            && echo "::error::Potential secret found — review output above" && exit 1 \
            || echo "No known secret patterns detected"

      - name: Security scan complete
        run: echo "✓ Security scan complete"
