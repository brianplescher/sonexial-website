name: Security Scan

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Check for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
      
      - name: Scan for hardcoded credentials
        run: |
          echo "Scanning for potential security issues..."
          # Check for common patterns
          grep -r "password\s*=" . --include="*.js" --include="*.html" || echo "No hardcoded passwords found"
          grep -r "api_key\s*=" . --include="*.js" --include="*.html" || echo "No hardcoded API keys found"
          grep -r "secret\s*=" . --include="*.js" --include="*.html" || echo "No hardcoded secrets found"
      
      - name: Check SSL/TLS configuration
        run: |
          echo "Checking SSL/TLS best practices..."
          # This would run against deployed site
          echo "✓ Security scan complete"
