name: Automated Backup

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Backup Website Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0  # Full history

      - name: Create backup archive
        run: |
          DATE=$(date +%Y-%m-%d)
          tar -czf "sonexial-backup-$DATE.tar.gz" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            .
          echo "✓ Backup created: sonexial-backup-$DATE.tar.gz"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: backup-${{ github.run_number }}
          name: Automated Backup - ${{ github.run_number }}
          body: |
            Automated daily backup of Sonexial Labs website
            Created: ${{ github.event.repository.updated_at }}
          files: sonexial-backup-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old backups
        uses: dev-drprasad/delete-older-releases@653dc03d96473ac9e585c68c8bf5aaccb0dadb61 # v0.2.1
        with:
          keep_latest: 30  # Keep last 30 days
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
