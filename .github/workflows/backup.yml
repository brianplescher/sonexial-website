name: Automated Backup

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write  # Release assets and old-backup cleanup

jobs:
  backup:
    name: Backup Website Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Full history

      - name: Create backup archive
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          ARCHIVE="sonexial-backup-$DATE.tar.gz"
          # Write outside the source tree while tar reads it. Writing in-place
          # caused "tar: .: file changed as we read it" on every scheduled run.
          tar -czf "$RUNNER_TEMP/$ARCHIVE" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            -C "$GITHUB_WORKSPACE" .
          mv "$RUNNER_TEMP/$ARCHIVE" "$GITHUB_WORKSPACE/$ARCHIVE"
          tar -tzf "$GITHUB_WORKSPACE/$ARCHIVE" > /dev/null
          echo "Backup created and verified: $ARCHIVE"

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: backup-${{ github.run_number }}
          name: Automated Backup - ${{ github.run_number }}
          body: |
            Automated daily backup of Sonexial Labs website
            Created: ${{ github.event.repository.updated_at }}
          files: sonexial-backup-*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old backups
        uses: dev-drprasad/delete-older-releases@653dc03d96473ac9e585c68c8bf5aaccb0dadb61 # v0.2.1
        with:
          keep_latest: 30  # Keep last 30 days
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
