name: Accessibility Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  a11y-test:
    name: Accessibility Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies and build site
        run: npm ci && npm run build

      - name: Start local server
        run: |
          npx http-server dist -a 127.0.0.1 -p 8080 -s > "$RUNNER_TEMP/sonexial-http.log" 2>&1 &
          for i in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8080/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sonexial-http.log"
          exit 1

      - name: Audit rendered pages with Pa11y
        run: |
          set +e
          failed=0
          echo 'Sonexial WCAG 2 AA checks' > a11y-report.txt
          for page in / /kits.html /tools/author-geo-audit/; do
            echo "--- $page ---" | tee -a a11y-report.txt
            npx pa11y --standard WCAG2AA "http://127.0.0.1:8080$page" >> a11y-report.txt 2>&1
            code=$?
            tail -n 35 a11y-report.txt
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: accessibility-report
          path: a11y-report.txt
          if-no-files-found: warn
