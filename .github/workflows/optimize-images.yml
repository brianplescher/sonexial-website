name: Optimize Images

on:
  push:
    paths:
      - 'Images/**'
      - '**.png'
      - '**.jpg'
      - '**.jpeg'

jobs:
  optimize:
    name: Optimize and Convert Images
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install image optimization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick optipng jpegoptim
      
      - name: Optimize PNG images
        run: |
          find Images -name "*.png" -exec optipng -o7 {} \;
          echo "✓ PNG images optimized"
      
      - name: Optimize JPEG images
        run: |
          find Images -name "*.jpg" -o -name "*.jpeg" | xargs jpegoptim --strip-all --max=85
          echo "✓ JPEG images optimized"
      
      - name: Convert to WebP
        run: |
          for file in Images/*.{jpg,jpeg,png}; do
            if [ -f "$file" ]; then
              cwebp -q 85 "$file" -o "${file%.*}.webp"
              echo "Converted: $file → ${file%.*}.webp"
            fi
          done
          echo "✓ WebP conversion complete"
      
      - name: Generate image report
        run: |
          echo "# Image Optimization Report" > image-report.md
          echo "" >> image-report.md
          echo "## Original Sizes" >> image-report.md
          find Images -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -exec ls -lh {} \; >> image-report.md
          echo "" >> image-report.md
          echo "## WebP Sizes" >> image-report.md
          find Images -name "*.webp" -exec ls -lh {} \; >> image-report.md
      
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: optimize images'
          title: 'Automated Image Optimization'
          body: |
            This PR contains automatically optimized images.
            
            - PNG images compressed with optipng
            - JPEG images compressed with jpegoptim
            - WebP versions created for all images
            
            Please review the changes and merge if acceptable.
          branch: automated-image-optimization
          delete-branch: true
