# Netlify Configuration
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "npm run build"

# Redirect rules
[[redirects]]
  from = "/checklist-download"
  to = "/assets/The_Author_Signal_Checklist.pdf"
  status = 200

[[redirects]]
  from = "/optimize"
  to = "https://sonexial.gumroad.com/l/optimize"
  status = 301

# 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

    # Documents must revalidate. Pretty URLs (/about, /kits, /blog/) are HTML but have no
    # extension, so an immutable default here would pin every page for a year.
    Cache-Control = "public, max-age=0, must-revalidate"

# Content-hashed bundles emitted by scripts/build.js — safe to cache forever.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Unhashed static media: long-lived but revalidatable.
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/Audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# Enable Gzip compression
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Environment variables (set in Netlify UI)
# GOOGLE_ANALYTICS_ID
# CLARITY_PROJECT_ID
# GUMROAD_PRODUCT_ID
