<!-- 
  GEO Scan Widget for Sonexial
  Add this section to your index.html or create a dedicated /geo-scan.html page
-->

<section id="geo-scan-widget" class="py-16 bg-gray-50">
  <div class="max-w-4xl mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-3xl font-bold mb-4">Free GEO Audit for Authors</h2>
      <p class="text-gray-600">
        Discover if AI engines like ChatGPT, Claude, and Perplexity can find your author website.
        Get instant actionable recommendations.
      </p>
    </div>

    <form id="geo-scan-form" class="max-w-xl mx-auto mb-8">
      <div class="flex flex-col sm:flex-row gap-4">
        <input
          type="url"
          id="author-url"
          name="author-url"
          placeholder="https://yourauthorwebsite.com"
          required
          class="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        />
        <button
          type="submit"
          id="scan-button"
          class="px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
        >
          Run Free Audit
        </button>
      </div>
    </form>

    <!-- Loading State -->
    <div id="scan-loading" class="hidden text-center py-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
      <p class="text-gray-600">Scanning your website... This takes about 2 seconds</p>
    </div>

    <!-- Results Container -->
    <div id="scan-results" class="hidden">
      <!-- Dynamic content injected here -->
    </div>

    <!-- Error Container -->
    <div id="scan-error" class="hidden mt-6 p-4 bg-red-50 border border-red-200 rounded-lg">
      <p class="text-red-700" id="error-message"></p>
    </div>
  </div>
</section>

<script>
(function() {
  // Configuration - Update this with your deployed API URL
  const API_BASE_URL = 'http://localhost:8000'; // Change to https://your-api.fly.dev in production

  const form = document.getElementById('geo-scan-form');
  const urlInput = document.getElementById('author-url');
  const scanButton = document.getElementById('scan-button');
  const loadingDiv = document.getElementById('scan-loading');
  const resultsDiv = document.getElementById('scan-results');
  const errorDiv = document.getElementById('scan-error');
  const errorMessage = document.getElementById('error-message');

  function showLoading() {
    loadingDiv.classList.remove('hidden');
    resultsDiv.classList.add('hidden');
    errorDiv.classList.add('hidden');
    scanButton.disabled = true;
    scanButton.textContent = 'Scanning...';
  }

  function hideLoading() {
    loadingDiv.classList.add('hidden');
    scanButton.disabled = false;
    scanButton.textContent = 'Run Free Audit';
  }

  function showError(message) {
    errorMessage.textContent = message;
    errorDiv.classList.remove('hidden');
  }

  function renderResults(report) {
    const scoreColor = report.score >= 80 ? 'text-green-600' : 
                       report.score >= 60 ? 'text-yellow-600' : 
                       report.score >= 40 ? 'text-orange-600' : 'text-red-600';
    
    const gradeBadge = report.geo_grade.includes('A') ? 'bg-green-100 text-green-800' :
                       report.geo_grade.includes('B') ? 'bg-yellow-100 text-yellow-800' :
                       report.geo_grade.includes('C') ? 'bg-orange-100 text-orange-800' : 'bg-red-100 text-red-800';

    let html = `
      <div class="bg-white rounded-xl shadow-lg p-6 sm:p-8">
        <div class="flex items-center justify-between mb-6">
          <div>
            <h3 class="text-2xl font-bold ${scoreColor}">GEO Score: ${report.score}/100</h3>
            <p class="text-gray-600">${report.url}</p>
          </div>
          <span class="px-4 py-2 rounded-full text-sm font-semibold ${gradeBadge}">
            ${report.geo_grade}
          </span>
        </div>

        ${report.critical_failures && report.critical_failures.length > 0 ? `
          <div class="mb-6">
            <h4 class="font-semibold text-red-700 mb-3 flex items-center">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
              </svg>
              Critical Issues (${report.critical_failures.length})
            </h4>
            <ul class="space-y-2">
              ${report.critical_failures.map(failure => `
                <li class="flex items-start text-red-600">
                  <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                  </svg>
                  ${failure}
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}

        ${report.recommendations && report.recommendations.length > 0 ? `
          <div class="mb-6">
            <h4 class="font-semibold text-blue-700 mb-3 flex items-center">
              <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM8 16v-1h4v1a2 2 0 11-4 0zM12 14c.015-.34.208-.646.477-.859a4 4 0 10-4.954 0c.27.213.462.519.476.859h4.002z"/>
              </svg>
              Recommendations (${report.recommendations.length})
            </h4>
            <ul class="space-y-2">
              ${report.recommendations.map(rec => `
                <li class="flex items-start text-gray-700">
                  <svg class="w-5 h-5 mr-2 flex-shrink-0 mt-0.5 text-blue-500" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                  </svg>
                  ${rec}
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}

        ${report.checks ? `
          <div class="mb-6 p-4 bg-gray-50 rounded-lg">
            <h4 class="font-semibold text-gray-700 mb-3">Detailed Analysis</h4>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-sm">
              ${Object.entries(report.checks).map(([key, value]) => `
                <div class="flex justify-between items-center">
                  <span class="text-gray-600 capitalize">${key.replace(/_/g, ' ')}</span>
                  <span class="${value === true || (typeof value === 'object' && Object.keys(value).length > 0) ? 'text-green-600 font-medium' : 'text-gray-400'}">
                    ${typeof value === 'boolean' ? (value ? '✓' : '✗') : 'Partial'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <div class="border-t pt-6 mt-6">
          <p class="text-gray-600 mb-4">
            ${report.score < 60 
              ? "Your website needs significant GEO optimization to be visible to AI engines."
              : report.score < 80
              ? "Your website has good foundations but needs some improvements for optimal AI visibility."
              : "Great job! Your website is well-optimized for AI discovery."
            }
          </p>
          <div class="flex flex-col sm:flex-row gap-4">
            <a 
              href="#contact" 
              class="flex-1 text-center px-6 py-3 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors"
            >
              Get Help Fixing These Issues
            </a>
            <button 
              onclick="document.getElementById('geo-scan-widget').scrollIntoView({behavior: 'smooth'})"
              class="px-6 py-3 border border-gray-300 text-gray-700 font-semibold rounded-lg hover:bg-gray-50 transition-colors"
            >
              Scan Another Site
            </button>
          </div>
        </div>
      </div>
    `;

    resultsDiv.innerHTML = html;
    resultsDiv.classList.remove('hidden');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const url = urlInput.value.trim();
    if (!url) {
      showError('Please enter a valid website URL');
      return;
    }

    showLoading();

    try {
      const response = await fetch(`${API_BASE_URL}/scan`, {
        method: 'POST',
        headers: { 
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ url })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.detail || `Scan failed with status ${response.status}`);
      }

      const report = await response.json();
      renderResults(report);
      
    } catch (error) {
      console.error('Scan error:', error);
      showError(error.message || 'Failed to scan the website. Please try again.');
    } finally {
      hideLoading();
    }
  });

  // Allow Enter key to trigger scan
  urlInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      form.dispatchEvent(new Event('submit'));
    }
  });
})();
</script>

<style>
/* Optional custom styles if not using Tailwind */
#geo-scan-widget input:focus,
#geo-scan-widget button:focus {
  outline: 2px solid #3b82f6;
  outline-offset: 2px;
}

#geo-scan-widget .animate-spin {
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
</style>
